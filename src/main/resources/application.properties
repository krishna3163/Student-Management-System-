# Server Configuration
server.port=8080

# Spring Data MongoDB Configuration
# For local MongoDB installation:
spring.data.mongodb.uri=mongodb://localhost:27017/student_db

# For MongoDB Atlas (Cloud database), replace the above line with:
# spring.data.mongodb.uri=mongodb+srv://<username>:<password>@cluster0.mongodb.net/student_db?retryWrites=true&w=majority

# Show SQL/Queries and formatting logs
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.com.example.studentmanagement=DEBUG
